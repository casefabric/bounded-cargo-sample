application {
  bind {
    host = 0.0.0.0
    port = 8100
  }

  lmdb-path = "run"
}

bounded {
  eventmaterializers.publish = false
}

pekko {
  loglevel = DEBUG
  #loglevel = ${?PEKKO_LOGLEVEL}
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]

  actor {
    serialize-creators = off
    serialize-messages = off
    serialization-bindings {
      "io.cafienne.bounded.aggregate.DomainEvent" = jackson-json
      // enable below to check if all taskEvents have been serialized without java.io.Serializable
      "java.io.Serializable" = none
    }
  }

  persistence {
    journal {
      plugin = "pekko.persistence.journal.leveldb"
      auto-start-journals = ["pekko.persistence.journal.leveldb"]
      leveldb {
        dir = "target/journal"
        # the native leveldbjni library has no build for Apple Silicon; the Java port is fine for a sample
        native = off
      }
    }
    snapshot-store {
      plugin = "pekko.persistence.snapshot-store.local"
      auto-start-snapshot-stores = ["pekko.persistence.snapshot-store.local"]
      local.dir = "target/snapshots"
    }
  }
}
