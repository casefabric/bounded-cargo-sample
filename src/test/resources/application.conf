# Test classpath version of application.conf: TestableAggregateRoot starts its own actor system from the default
# application config, so this keeps the LevelDB journal of the main application.conf out of the tests.
# The serialization settings match the main configuration.
pekko {
  loglevel = DEBUG
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]

  actor {
    serialize-creators = off
    serialize-messages = off
    serialization-bindings {
      "io.cafienne.bounded.aggregate.DomainEvent" = jackson-json
      "java.io.Serializable" = none
    }
  }
}

# ConfigFactory merges every application.conf on the classpath, so the LevelDB auto-start of the main one is undone here
pekko.persistence.journal.auto-start-journals = []
pekko.persistence.snapshot-store.auto-start-snapshot-stores = []
